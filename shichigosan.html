const { useState } = React;
const LINE_URL = 'https://lin.ee/pSxLqqB';

function Nav() {

    <header style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 1000, background: '#F2EDE6', borderBottom: '1px solid var(--border)', backdropFilter: 'blur(8px)' }}>

              onMouseLeave={e => e.target.style.color = 'var(--text-mid)'}
            >{l.label}</a>
          ))}
          <a href={LINE_URL} target="_blank" rel="noopener" className="btn btn--line btn--sm">LINEで相談する</a>

        <button onClick={() => setOpen(!open)} className="ham-btn" style={{ background: 'none', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', gap: 5, padding: 4 }}>

      </div>

        <div style={{ background: 'var(--bg-white)', borderTop: '1px solid var(--border)', padding: '20px 32px 28px' }}>

}

    </svg>
  );
}

      imgAlt: '神社でのお参り'

    {

      body: '雨天・体調不良など、やむを得ない事情での延期はキャンセル料がかかりません。当日の朝でもLINEでご連絡ください。平日・土日・祝日問わず対応しています。',

      imgAlt: '撮影日程のご相談'
    },
    {
      num: '03',

    { num: '3', title: '撮影当日', body: 'お参りの様子から家族写真まで、50〜60分ゆっくり撮影します。' },
    { num: '4', title: '写真データのお届け', body: '撮影から2週間以内に、オンラインで全データをお渡しします。85カット以上。' },
  ];

    {
      q: '雨が降ったらどうなりますか？',

    },
    {

    },
    {

      a: 'はい、ご家族みんなで撮影できます。人数による追加料金はありません。ぜひご一緒にどうぞ。'
    },
    {
      q: '子どもが泣いてしまわないか心配です',
      a: '大丈夫です。時間に余裕をもって、お子さんのペースに合わせて撮影します。17年の経験で、ぐずってしまっても自然な笑顔を引き出します。'
    },
    {
      q: '外部のカメラマン（出張カメラマン）が入れない神社はありますか？',
      a: 'あります。まずは、神社にご祈祷日の確認をする際に、出張カメラマンが神社で撮影してもいいか否かご確認をお願いします。また、祈祷中の撮影の可否も合わせてご確認いただけるとスムーズです。'
    },
  ];

  return (
    <>
      <Nav />
      <div style={{ paddingTop: 88 }}>

        {/* Hero */}
        <div style={{ position: 'relative', overflow: 'hidden', background: 'var(--bg-cream)', minHeight: 'clamp(320px, 50vw, 520px)', display: 'flex', alignItems: 'center' }}>
          {/* 背景画像 */}
          <div style={{ position: 'absolute', top: 0, right: 0, bottom: 0, width: '52%', overflow: 'hidden' }} className="hero-img-wrap">

            <h2 style={{ fontFamily: 'var(--serif)', fontSize: 'clamp(20px,2.4vw,28px)', fontWeight: 400, textAlign: 'center', marginBottom: 40 }}>プランと料金</h2>

            {/* プランカード */}

                { name: '土日祝プラン', price: '41,300', note: '土・日・祝日' },

                      '85カット以上（全データ）',
                      '全カットレタッチ済み',
                    ].map((t, i) => (
                      <div key={i} style={{ display: 'flex', gap: 8, alignItems: 'flex-start', fontSize: 13 }}>
                        <span style={{ color: 'var(--accent)', flexShrink: 0, marginTop: 2 }}>✓</span>
                        <span style={{ color: 'var(--text-mid)', lineHeight: 1.6 }}>{t}</span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>

            {/* 出張費 */}
            <div style={{ background: 'var(--bg-white)', border: '1px solid var(--border)', padding: '20px 24px', marginBottom: 16 }}>
              <p style={{ fontSize: 13, fontWeight: 500, marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 16 }}>🚃</span>
                出張費（JR東小金井駅が基点）

              <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
                {[
                  { area: '片道20分以内（小金井市・武蔵野市・三鷹市・国分寺市・西東京市ほか）', fee: '無料' },
                  { area: '片道20〜40分', fee: '1,000円' },
                  { area: '片道40〜60分', fee: '2,000円' },
                ].map((f, i) => (
                  <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid var(--border)', gap: 16, alignItems: 'center' }}>

                    <span style={{ fontSize: 14, fontFamily: 'var(--serif)', flexShrink: 0 }}>{f.fee}</span>
                  </div>

            {/* リピーター割 */}

              <p style={{ fontSize: 13, color: 'var(--text-mid)' }}>
                <span style={{ fontWeight: 500, color: 'var(--text)' }}>リピーター割引 −3,000円 </span>
                ／ 過去にいち日写真館をご利用の方は合計から割引します
              </p>
            </div>

            <p style={{ fontSize: 12, color: 'var(--text-light)', lineHeight: 1.9 }}>
              ※ 公園使用料・神社への参拝許可が必要な場合はお客様のご負担となります。<br/>
              ※ オプション（ショートムービー・アルバムなど）は<a href="celebration.html" style={{ color: 'var(--accent)', textDecoration: 'underline' }}>詳細ページ</a>をご覧ください。

                      <span style={{ fontFamily: 'var(--serif)', fontSize: 15, color: '#fff', fontWeight: 400 }}>{s.num}</span>

                      <div style={{ width: 1, flex: 1, background: 'var(--border)', margin: '8px 0' }}/>

                  </div>

                <div key={i} style={{ borderTop: '1px solid var(--border)', borderBottom: i === faqs.length - 1 ? '1px solid var(--border)' : 'none' }}>
                  <button
                    onClick={() => setOpenFaq(openFaq === i ? null : i)}
                    style={{ width: '100%', background: 'none', border: 'none', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 16, padding: '20px 0', textAlign: 'left' }}
